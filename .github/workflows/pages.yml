name: Publish research pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-sakura-crossing/**'
      - 'projects/002-18-floors-of-mayhem/**'
      - 'projects/004-muster-ww2/**'
      - 'projects/005-taohuayuan/**'
      - 'projects/006-telegram-media-downloader/**'
      - 'projects/007-google-vids/**'
      - 'projects/008-pdoom-video/**'
      - 'projects/009-jevclip/**'
      - 'projects/010-cadence-foraging/**'
      - 'projects/011-segment-snap/**'
      - 'projects/013-model-video-studio/**'
      - 'projects/014-print-bench/**'
      - 'projects.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/001-sakura-crossing/web/package-lock.json
      - run: npm run check
      - run: npm ci
        working-directory: projects/001-sakura-crossing/web
      - run: npm run research:sync && npm run build
        working-directory: projects/001-sakura-crossing/web
      - name: Fetch pinned game for Room integration test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: andyhuo520/18-floors-of-mayhem
          ref: 99d7215966762a13b17b54d36f9ae3e3b96f98df
          path: projects/002-18-floors-of-mayhem/vendor/upstream
          sparse-checkout: |
            shared
            public
          persist-credentials: false
      - run: npm ci
        working-directory: projects/002-18-floors-of-mayhem/vendor/upstream
      - run: npm run check && npm test && npm run references:check && npm run guide:check && npm run build && npm run publication:check
        working-directory: projects/002-18-floors-of-mayhem/web
      - run: npm ci
        working-directory: projects/004-muster-ww2/web
      - run: npm run test:battle -- --no-report && npm run test:airport -- --no-report && npm run build && npm run publication:check
        working-directory: projects/004-muster-ww2/web
      - run: npm ci && npm run research:sync && npm test && npm run build:research && npm run publication:check
        working-directory: projects/005-taohuayuan/web
      - name: Build and verify Telegram media research
        run: npm run research:sync && npm run check && npm run build && npm run publication:check
        working-directory: projects/006-telegram-media-downloader/web
      - name: Prepare video verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Verify local MV tool and build PDoomVideo research
        run: npm ci && npm test && npm run build && npm run build:research && npm run publication:check
        working-directory: projects/008-pdoom-video/web
      - name: Build and verify Jevclip research and subtitle assistant
        run: npm run research:sync && npm run check && npm test && npm run build && npm run publication:check
        working-directory: projects/009-jevclip/web
      - name: Verify studio and build Vids research publication
        run: npm ci && npm run check && npm run build:research && npm run publication:check
        working-directory: projects/013-model-video-studio/web
      - name: Build and verify Cadence research and real computation replay
        run: npm ci && npm run check && npm run build:public && npm run publication:check
        working-directory: projects/010-cadence-foraging/web
      - name: Build and verify print-bench research
        run: npm run research:sync && npm run check && npm run build && npm run publication:check
        working-directory: projects/014-print-bench/web
      - name: Build and verify Segment-Snap research and illustrative interactions
        run: npm run research:sync && npm run check && npm run build && npm run publication:check
        working-directory: projects/011-segment-snap/web
      - run: npm run site:assemble
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static research
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
